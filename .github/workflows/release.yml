# Versions and publishes the packages with Changesets, following its trusted-publishing setup
# (https://changesets.dev/guide/automating#trusted-publishing):
#
# - changesets on main: open or update the "Release packages" pull request, which bumps versions, ranges
#   between the packages and changelogs;
# - no changesets, and a package whose version is not on npm yet: pack every such package, then publish
#   them to npm in dependency order, with provenance, and tag and release each on GitHub.
#
# Publishing uses npm trusted publishing (OIDC), so the repository holds no npm token. Each package needs
# this workflow configured as its trusted publisher on npmjs.com; see "Releasing" in the README.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Reset, then grant each job only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version changes
      pull-requests: write # open the release pull request
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Version packages and open the release pull request
        uses: changesets/action/version@v2
        with:
          script: bun run changeset:version
          commit-message: "chore: release packages"
          pr-title: "Release packages"

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # The whole check, so nothing is packed that CI would refuse.
      - run: bun run check
      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and create GitHub releases
      id-token: write # npm trusted publishing, which also signs provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@12
      - run: bun install --frozen-lockfile
      - name: Publish packages
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
